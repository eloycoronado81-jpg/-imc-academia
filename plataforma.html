<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMC Academia — Plataforma</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --blue:#0B2545;
    --paper:#F5F4EF;
    --paper-2:#EAE8E0;
    --accent:#FF6B35;
    --accent-dark:#D6501D;
    --line: rgba(11,37,69,0.14);
    --muted:#5B6472;
    --radius:3px;
    --font-display:'Oswald', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--blue);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  button,input{font-family:inherit;}

  .wrap{max-width:820px;margin:0 auto;padding:0 24px;}

  .navbar{border-bottom:1px solid var(--line);}
  .nav-inner{max-width:820px;margin:0 auto;padding:0 24px;height:66px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:var(--font-display);font-weight:700;font-size:21px;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--blue);}
  .brand-mark{width:14px;height:14px;border:2px solid var(--accent);transform:rotate(45deg);}
  .back-link{font-size:13px;color:var(--muted);text-decoration:none;font-family:var(--font-mono);}
  .back-link:hover{color:var(--blue);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;font-size:14px;font-weight:600;border-radius:var(--radius);border:1.5px solid transparent;cursor:pointer;transition:transform .12s, background .15s, border-color .15s;text-decoration:none;background:none;}
  .btn:active{transform:scale(0.98);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .btn-ghost{background:transparent;color:var(--blue);border-color:var(--line);}
  .btn-block{width:100%;}

  .panel{max-width:420px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:36px;}
  .panel h1{font-family:var(--font-display);font-weight:700;font-size:24px;text-transform:uppercase;margin:0 0 8px;}
  .panel p{color:var(--muted);font-size:14px;margin:0 0 22px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--muted);}
  .field input{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:var(--paper);color:var(--blue);}
  .field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .msg{font-size:13.5px;margin-top:14px;min-height:18px;}
  .msg.ok{color:#1E8A63;}
  .msg.err{color:var(--accent-dark);}

  .dash-head{display:flex;justify-content:space-between;align-items:center;padding:36px 0 20px;border-bottom:1px solid var(--line);margin-bottom:32px;}
  .dash-title{font-family:var(--font-display);font-weight:700;font-size:22px;text-transform:uppercase;margin:0;}
  .dash-sub{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:4px;}

  .section-title{font-family:var(--font-mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-dark);margin:0 0 16px;}

  .prog-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:44px;}
  .prog-item{background:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .prog-name{font-weight:600;font-size:15px;margin:0 0 4px;}
  .prog-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);}
  .prog-bar-track{width:120px;height:6px;background:var(--paper-2);border-radius:4px;overflow:hidden;}
  .prog-bar-fill{height:100%;background:var(--accent);}

  #loading{text-align:center;padding:80px 0;color:var(--muted);font-family:var(--font-mono);font-size:13px;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark"></span>IMC Academia</a>
    <a class="back-link" href="index.html">← Volver al inicio</a>
  </div>
</header>

<div id="loading">Cargando…</div>

<div id="loginPanel" class="panel hidden">
  <h1>Ingresar</h1>
  <p>Te mandamos un enlace de acceso a tu correo — sin contraseñas que recordar.</p>
  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">Correo electrónico</label>
      <input id="loginEmail" type="email" placeholder="tucorreo@ejemplo.com" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Enviar enlace de acceso</button>
    <p class="msg" id="loginMsg"></p>
  </form>
</div>

<div id="dashboard" class="wrap hidden">
  <div class="dash-head">
    <div>
      <h1 class="dash-title">Mi panel</h1>
      <div class="dash-sub" id="userEmail"></div>
    </div>
    <button class="btn btn-ghost" id="logoutBtn">Cerrar sesión</button>
  </div>

  <div id="misProgramas">
    <div class="section-title">Mis programas</div>
    <div class="prog-list" id="misProgramasList"></div>
  </div>

  <div>
    <div class="section-title">Catálogo completo</div>
    <div class="prog-list" id="catalogoList"></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const supabase = createClient(
    'https://lixivclmhbcdztqpydnl.supabase.co',
    'sb_publishable_qnyiTwLqB0033E13lNuWpg_tuRWfJgM'
  );

  const loadingEl = document.getElementById('loading');
  const loginPanel = document.getElementById('loginPanel');
  const dashboard = document.getElementById('dashboard');

  async function ensureProfile(user){
    const { data: existing } = await supabase.from('usuarios').select('id').eq('id', user.id).maybeSingle();
    if (!existing){
      await supabase.from('usuarios').insert({
        id: user.id,
        nombre: user.email.split('@')[0],
        correo: user.email
      });
    }
  }

  function progItemHTML(programa, inscripcion){
    const pct = inscripcion ? Number(inscripcion.progreso_pct) : 0;
    const actionHTML = inscripcion
      ? `<div class="prog-bar-track"><div class="prog-bar-fill" style="width:${pct}%"></div></div>`
      : `<button class="btn btn-primary" data-programa-id="${programa.id}">Inscribirme</button>`;
    return `
      <div class="prog-item">
        <div>
          <p class="prog-name">${programa.titulo}</p>
          <span class="prog-meta">${programa.duracion_semanas} semanas · ${inscripcion ? (inscripcion.estado) : 'disponible'}</span>
        </div>
        ${actionHTML}
      </div>`;
  }

  async function loadDashboard(user){
    document.getElementById('userEmail').textContent = user.email;

    const { data: programas } = await supabase.from('programas').select('*').eq('activo', true).order('orden');
    const { data: inscripciones } = await supabase.from('inscripciones').select('*').eq('usuario_id', user.id);

    const inscMap = {};
    (inscripciones || []).forEach(i => { inscMap[i.programa_id] = i; });

    const misList = document.getElementById('misProgramasList');
    const catList = document.getElementById('catalogoList');
    misList.innerHTML = '';
    catList.innerHTML = '';

    const inscritos = (programas || []).filter(p => inscMap[p.id]);
    const disponibles = (programas || []).filter(p => !inscMap[p.id]);

    if (inscritos.length === 0){
      misList.innerHTML = '<div class="prog-item"><p class="prog-meta" style="margin:0;">Aún no te inscribes a ningún programa — elige uno del catálogo.</p></div>';
    } else {
      inscritos.forEach(p => misList.insertAdjacentHTML('beforeend', progItemHTML(p, inscMap[p.id])));
    }

    disponibles.forEach(p => catList.insertAdjacentHTML('beforeend', progItemHTML(p, null)));
    if (disponibles.length === 0){
      catList.innerHTML = '<div class="prog-item"><p class="prog-meta" style="margin:0;">Ya estás inscrito en todos los programas disponibles.</p></div>';
    }

    catList.querySelectorAll('button[data-programa-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Inscribiendo…';
        const { error } = await supabase.from('inscripciones').insert({
          usuario_id: user.id,
          programa_id: btn.dataset.programaId
        });
        if (!error) {
          await loadDashboard(user);
        } else {
          btn.disabled = false;
          btn.textContent = 'Inscribirme';
        }
      });
    });
  }

  async function showLoggedIn(user){
    await ensureProfile(user);
    await loadDashboard(user);
    loadingEl.classList.add('hidden');
    loginPanel.classList.add('hidden');
    dashboard.classList.remove('hidden');
  }

  function showLoggedOut(){
    loadingEl.classList.add('hidden');
    dashboard.classList.add('hidden');
    loginPanel.classList.remove('hidden');
  }

  const { data: { session } } = await supabase.auth.getSession();
  if (session){
    showLoggedIn(session.user);
  } else {
    showLoggedOut();
  }

  supabase.auth.onAuthStateChange((event, session) => {
    if (session) showLoggedIn(session.user);
    else showLoggedOut();
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('loginMsg');
    btn.disabled = true;
    btn.textContent = 'Enviando…';
    msg.textContent = '';

    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href }
    });

    if (error){
      msg.textContent = 'No pudimos enviar el enlace. Intenta de nuevo.';
      msg.className = 'msg err';
    } else {
      msg.textContent = 'Listo, revisa tu correo (' + email + ') y haz clic en el enlace.';
      msg.className = 'msg ok';
    }
    btn.disabled = false;
    btn.textContent = 'Enviar enlace de acceso';
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
  });
</script>

</body>
</html>
